name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test Linux JNI and packaging
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          17
          21
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: gradle/actions/setup-gradle@v5
    - name: Install native tools
      run: python -m pip install --only-binary=cmake -r tools/native-build-requirements.txt
    - name: Build and test actual JNI
      run: ./gradlew --no-daemon --max-workers=2 test packageNativeSources
    - name: Check native validators and source packaging
      run: |
        python tools/test_macos_native.py
        python tools/test_private_dependencies.py
        python tools/test_package_native_sources.py
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-jni-tests
        path: |
          build/reports/tests/
          build/test-results/
          build/source-archives/

  build-android:
    name: Build Android platform allocator
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          17
          21
    - uses: gradle/actions/setup-gradle@v5
    - name: Build Android ARM64 JNI without mimalloc
      run: ./gradlew --no-daemon --max-workers=2 :compileNativeForAndroidArm64V8a
    - uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-android-arm64
        path: build/dockcross/android-arm64-v8a/native/libdatachannel-java.so
        if-no-files-found: error

  test-windows:
    name: Test Windows JNI
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          17
          21
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: gradle/actions/setup-gradle@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make make perl
    - name: Install native tools
      shell: pwsh
      run: python -m pip install --only-binary=cmake -r tools/native-build-requirements.txt
    - name: Build actual Windows JNI
      shell: msys2 {0}
      env:
        CC: gcc
        CXX: g++
        CMAKE_GENERATOR: MinGW Makefiles
      run: |
        export LIBDATACHANNEL_BASH="$(cygpath -m /usr/bin/bash.exe)"
        ./gradlew --no-daemon --max-workers=2 compileNativeForHost
        for library in build/dockcross/host/native/*.dll; do
          echo "$library"
          objdump -p "$library" > "$library.imports.txt"
          sed -n '/DLL Name:/p' "$library.imports.txt"
        done
        if sed -n '/The Import Tables/,/The Export Tables/p' build/dockcross/host/native/libdatachannel-java.dll.imports.txt | grep -E '[[:space:]]DllMain(@[0-9]+)?$'; then
          echo '::error::JNI must own its DLL entry point instead of importing the allocator entry point'
          exit 1
        fi
    - name: Test actual Windows JNI
      shell: msys2 {0}
      env:
        CC: gcc
        CXX: g++
        CMAKE_GENERATOR: MinGW Makefiles
      run: |
        export LIBDATACHANNEL_BASH="$(cygpath -m /usr/bin/bash.exe)"
        ./gradlew --no-daemon --max-workers=2 test
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: windows-jni-tests
        path: |
          build/reports/tests/
          build/test-results/
          build/dockcross/host/native/*.dll
          build/dockcross/host/native/*.dll.imports.txt

  build-macos:
    name: Build macOS Native Libraries
    strategy:
      matrix:
        include:
          - os: macos-26  # Apple Silicon runner
            classifier: macos-arm64
          - os: macos-15-intel  # Intel runner
            classifier: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/native-build-requirements.txt

    - name: Install native build tools
      run: |
        native_tools_dir="$RUNNER_TEMP/libdatachannel-native-tools"
        python -m venv "$native_tools_dir"
        "$native_tools_dir/bin/python" -m pip install --only-binary=cmake -r tools/native-build-requirements.txt
        echo "$native_tools_dir/bin" >> "$GITHUB_PATH"
        "$native_tools_dir/bin/cmake" --version
        "$native_tools_dir/bin/conan" --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Verify architecture
      run: |
        echo "Running on: $(uname -m)"
        echo "Classifier: ${{ matrix.classifier }}"

    - name: Build native library for host
      run: ./gradlew :compileNativeForHost :test

    - name: Upload loader test reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: loader-tests-${{ matrix.classifier }}
        path: |
          build/reports/tests/test/
          build/test-results/test/
        if-no-files-found: warn

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-${{ matrix.classifier }}
        path: |
          build/dockcross/host/native/libdatachannel-java.dylib
        retention-days: 30
        if-no-files-found: error

  build:
    needs:
    - build-macos
    - build-ios
    - build-android
    - test-linux
    - test-windows
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') ) && 'sonatype-central' || null }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Download macOS ARM64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: libdatachannel-macos-arm64
        path: artifacts/macos-arm64/

    - name: Download macOS x86_64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: libdatachannel-macos-x86_64
        path: artifacts/macos-x86_64/

    - name: Download iOS artifacts
      uses: actions/download-artifact@v7
      with:
        name: libdatachannel-ios
        path: artifacts/ios/

    - name: Build
      run: |
        prebuilts=(
          -Plibdatachannel.macos-arm64.prebuilt-path=artifacts/macos-arm64/libdatachannel-java.dylib
          -Plibdatachannel.macos-x86_64.prebuilt-path=artifacts/macos-x86_64/libdatachannel-java.dylib
          -Plibdatachannel.ios.prebuilt-path=artifacts/ios
        )
        ./gradlew --no-configuration-cache :githubActions :packageNativeForMacosArm64 :packageNativeForMacosX8664 :packageNativeForIos "${prebuilts[@]}"
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        ORG_GRADLE_PROJECT_mavenCentralSnapshotsUsername: ${{ secrets.SONATYPE_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralSnapshotsPassword: ${{ secrets.SONATYPE_PASSWORD }}
        MAVEN_CENTRAL_PORTAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MAVEN_CENTRAL_PORTAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        LIBDATACHANNEL_JAVA_GROUP_OVERRIDE: ${{ vars.LIBDATACHANNEL_JAVA_GROUP_OVERRIDE   }}

  build-ios:
    name: Build iOS Native Frameworks
    runs-on: macos-26
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/native-build-requirements.txt

    - name: Install native build tools
      run: |
        native_tools_dir="$RUNNER_TEMP/libdatachannel-native-tools"
        python -m venv "$native_tools_dir"
        "$native_tools_dir/bin/python" -m pip install --only-binary=cmake -r tools/native-build-requirements.txt
        echo "$native_tools_dir/bin" >> "$GITHUB_PATH"
        "$native_tools_dir/bin/cmake" --version
        "$native_tools_dir/bin/conan" --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build iOS xcframework
      run: ./gradlew --no-configuration-cache compileNativeForIos

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-ios
        path: build/dockcross/ios/native/lib/ios/
        retention-days: 30
        if-no-files-found: error
